name: Build APK

on:
  push:
    branches: [claude/android-firewood-ocr-app-QaW5b, claude/migrate-gradle-plugin-LqPUn, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID=${{ secrets.DRIVE_FOLDER_ID }}
          EOF

      - name: Create service_account.json
        run: |
          mkdir -p assets
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > assets/service_account.json

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: |
          python3 - <<'PYEOF'
          import os, struct, zlib

          def make_chunk(name, data):
              chunk = name + data
              return struct.pack('>I', len(data)) + chunk + struct.pack('>I', zlib.crc32(chunk) & 0xffffffff)

          def create_png(size, r, g, b):
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = make_chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              raw = b''.join(b'\x00' + bytes([r, g, b] * size) for _ in range(size))
              idat = make_chunk(b'IDAT', zlib.compress(raw))
              iend = make_chunk(b'IEND', b'')
              return header + ihdr + idat + iend

          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          base = 'android/app/src/main/res'
          png_data = create_png(192, 76, 175, 80)

          for folder, size in sizes.items():
              os.makedirs(f'{base}/{folder}', exist_ok=True)
              small = create_png(size, 76, 175, 80)
              with open(f'{base}/{folder}/ic_launcher.png', 'wb') as f:
                  f.write(small)

          print('Launcher icons generated.')
          PYEOF

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: controle-lenha-trbj-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
